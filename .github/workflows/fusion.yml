name: Refine Shadowrocket ad diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Module.sgmodule'
      - '.github/workflows/fusion.yml'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  refine-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Zhuzher fix and Tencent diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          module = Path('Module.sgmodule')
          lines = module.read_text('utf-8').splitlines()

          # 1) 住这儿：取消旧的 reject-dict / 诊断脚本，正式返回“200 + 空 data”。
          lines = [
              line for line in lines
              if not (
                  'api\\.5th\\.zone\\/ads\\/v3\\/type\\/' in line
                  and 'items' in line
                  and 'reject-dict' in line
              )
          ]
          lines = [line for line in lines if not line.startswith('diag_5th_ads =')]
          lines = [line for line in lines if not line.startswith('zhuzher_ads_empty =')]
          lines = [line for line in lines if line.strip() not in {
              '# ===== 临时诊断：住这儿广告 API 真实响应（不修改内容） =====',
              '# ===== 住这儿：广告 API 返回空列表 =====',
          }]

          script_idx = lines.index('[Script]')
          lines[script_idx+1:script_idx+1] = [
              '# ===== 住这儿：广告 API 返回空列表 =====',
              r'zhuzher_ads_empty =type=http-response, pattern=^https?:\/\/api\.5th\.zone\/ads\/v3\/type\/\d+\/items(?:\?.*)?$, script-path=https://raw.githubusercontent.com/miketoryan/Shadowrocket-Fusion-Personal/main/scripts/zhuzher_ads_empty.js, requires-body=true, max-size=0',
              '',
          ]

          # 2) 腾讯手机管家：COS 路径的 UA=cloudd，确定不是手机管家广告，撤掉该 MITM。
          #    下一轮只观察 content.rconfig.qq.com 的具体路径，不阻断。
          remove_mitm = {'ta-cn-south-00001-1329476759.cos.accelerate.tencentcos.cn'}
          add_mitm = ['api.5th.zone', 'content.rconfig.qq.com']
          for i, line in enumerate(lines):
              if line.startswith('hostname = '):
                  hosts = [x.strip() for x in line.split('=', 1)[1].split(',') if x.strip()]
                  hosts = [h for h in hosts if h not in remove_mitm]
                  for host in add_mitm:
                      if host not in hosts:
                          hosts.append(host)
                  seen = set()
                  deduped = []
                  for host in hosts:
                      if host not in seen:
                          seen.add(host)
                          deduped.append(host)
                  lines[i] = 'hostname = ' + ','.join(deduped)
                  break
          else:
              raise SystemExit('MITM hostname line not found')

          # 3) 更新时间戳。
          ts = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M')
          lines[0] = '#!name=广告屏蔽联网版'
          lines[1] = f'#!desc=仓库更新时间：{ts}'
          module.write_text('\n'.join(lines) + '\n', 'utf-8')

          readme = Path('README.md')
          if readme.exists():
              text = readme.read_text('utf-8')
              text = re.sub(r'- \*\*最近更新时间：\*\* .*', f'- **最近更新时间：** {ts}', text)
              text = re.sub(r'仓库更新时间：\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2})?', f'仓库更新时间：{ts}', text)
              readme.write_text(text, 'utf-8')
          print(f'Refined module stamped: {ts} Asia/Shanghai')
          PY

      - name: Validate refined module
        shell: bash
        run: |
          set -euo pipefail
          test -s Module.sgmodule
          test "$(head -n 1 Module.sgmodule)" = '#!name=广告屏蔽联网版'
          grep -Eq '^#!desc=仓库更新时间：[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$' Module.sgmodule
          grep -q '^\[Rule\]$' Module.sgmodule
          grep -q '^\[URL Rewrite\]$' Module.sgmodule
          grep -q '^\[Script\]$' Module.sgmodule
          grep -q '^\[MITM\]$' Module.sgmodule
          test "$(grep -c '^hostname = ' Module.sgmodule)" -eq 1
          grep -q '^DOMAIN,api\.5th\.zone,DIRECT$' Module.sgmodule
          grep -q '^DOMAIN,media\.5th\.zone,DIRECT$' Module.sgmodule
          grep -q '^DOMAIN,i\.4009515151\.com,DIRECT$' Module.sgmodule
          grep -Fq 'zhuzher_ads_empty.js' Module.sgmodule
          ! grep -q '^diag_5th_ads =' Module.sgmodule
          grep '^hostname = ' Module.sgmodule | grep -q 'content.rconfig.qq.com'
          ! grep '^hostname = ' Module.sgmodule | grep -q 'ta-cn-south-00001-1329476759.cos.accelerate.tencentcos.cn'
          ! grep -q 'app2smile/rules/master/js/bilibili\.js' Module.sgmodule
          ! grep -q 'umetrip_ads\.js' Module.sgmodule
          ! grep -q '/JavaScript/jd\.js' Module.sgmodule
          echo "Refined module validation passed."

      - name: Commit refined module
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Module.sgmodule README.md
          if git diff --cached --quiet; then
            echo "No refined module change needed."
            exit 0
          fi
          git commit -m "fix: empty Zhuzher ads and narrow Tencent diagnostic"
          git push
