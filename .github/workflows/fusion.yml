name: Assemble Shadowrocket module

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'module_parts/**'

permissions:
  contents: write

concurrency:
  group: shadowrocket-module-assemble
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble when all chunks exist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(module_parts/chunk*.b64)
          if [ "${#parts[@]}" -ne 7 ]; then
            echo "Waiting for 7 chunks; found ${#parts[@]}."
            exit 0
          fi
          cat "${parts[@]}" | tr -d '\n\r ' | base64 --decode > Module.sgmodule
          test "$(head -n 1 Module.sgmodule)" = '#!name=广告屏蔽'
          grep -q '^\[Rule\]$' Module.sgmodule
          grep -q '^\[MITM\]$' Module.sgmodule

      - name: Commit assembled module
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(module_parts/chunk*.b64)
          if [ "${#parts[@]}" -ne 7 ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Module.sgmodule
          if git diff --cached --quiet; then
            echo "Module already current."
            exit 0
          fi
          git commit -m "update: sync latest ad-block module"
          git push
