name: Refine Shadowrocket ad diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Module.sgmodule'
      - '.github/workflows/fusion.yml'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  refine-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted Tencent diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          module = Path('Module.sgmodule')
          lines = module.read_text('utf-8').splitlines()

          # 1) 住这儿正式空列表脚本保持不变。
          #    本轮日志已确认脚本实际执行；若首屏仍出现，更符合“先展示旧缓存、再联网更新”的行为。

          # 2) 腾讯手机管家：content.rconfig.qq.com 只命中 GetLogConfigService，排除为广告源。
          #    下一轮只观察 luban.m.qq.com 的具体 HTTPS 路径，不阻断。
          remove_mitm = {
              'content.rconfig.qq.com',
              'ta-cn-south-00001-1329476759.cos.accelerate.tencentcos.cn',
          }
          add_mitm = ['api.5th.zone', 'luban.m.qq.com']
          for i, line in enumerate(lines):
              if line.startswith('hostname = '):
                  hosts = [x.strip() for x in line.split('=', 1)[1].split(',') if x.strip()]
                  hosts = [h for h in hosts if h not in remove_mitm]
                  for host in add_mitm:
                      if host not in hosts:
                          hosts.append(host)
                  seen = set()
                  deduped = []
                  for host in hosts:
                      if host not in seen:
                          seen.add(host)
                          deduped.append(host)
                  lines[i] = 'hostname = ' + ','.join(deduped)
                  break
          else:
              raise SystemExit('MITM hostname line not found')

          # 3) 更新时间戳。
          ts = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M')
          lines[0] = '#!name=广告屏蔽联网版'
          lines[1] = f'#!desc=仓库更新时间：{ts}'
          module.write_text('\n'.join(lines) + '\n', 'utf-8')

          readme = Path('README.md')
          if readme.exists():
              text = readme.read_text('utf-8')
              text = re.sub(r'- \*\*最近更新时间：\*\* .*', f'- **最近更新时间：** {ts}', text)
              text = re.sub(r'仓库更新时间：\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2})?', f'仓库更新时间：{ts}', text)
              readme.write_text(text, 'utf-8')
          print(f'Refined module stamped: {ts} Asia/Shanghai')
          PY

      - name: Validate refined module
        shell: bash
        run: |
          set -euo pipefail
          test -s Module.sgmodule
          test "$(head -n 1 Module.sgmodule)" = '#!name=广告屏蔽联网版'
          grep -Eq '^#!desc=仓库更新时间：[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$' Module.sgmodule
          grep -q '^\[Rule\]$' Module.sgmodule
          grep -q '^\[URL Rewrite\]$' Module.sgmodule
          grep -q '^\[Script\]$' Module.sgmodule
          grep -q '^\[MITM\]$' Module.sgmodule
          test "$(grep -c '^hostname = ' Module.sgmodule)" -eq 1
          grep -q '^DOMAIN,api\.5th\.zone,DIRECT$' Module.sgmodule
          grep -q '^DOMAIN,media\.5th\.zone,DIRECT$' Module.sgmodule
          grep -q '^DOMAIN,i\.4009515151\.com,DIRECT$' Module.sgmodule
          grep -Fq 'zhuzher_ads_empty.js' Module.sgmodule
          grep '^hostname = ' Module.sgmodule | grep -q 'api.5th.zone'
          grep '^hostname = ' Module.sgmodule | grep -q 'luban.m.qq.com'
          ! grep '^hostname = ' Module.sgmodule | grep -q 'content.rconfig.qq.com'
          ! grep '^hostname = ' Module.sgmodule | grep -q 'ta-cn-south-00001-1329476759.cos.accelerate.tencentcos.cn'
          ! grep -q 'app2smile/rules/master/js/bilibili\.js' Module.sgmodule
          ! grep -q 'umetrip_ads\.js' Module.sgmodule
          ! grep -q '/JavaScript/jd\.js' Module.sgmodule
          echo "Refined module validation passed."

      - name: Commit refined module
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Module.sgmodule README.md
          if git diff --cached --quiet; then
            echo "No refined module change needed."
            exit 0
          fi
          git commit -m "diag: inspect Tencent luban path"
          git push
