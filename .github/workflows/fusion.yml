name: Stamp and validate Shadowrocket module

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Module.sgmodule'
      - '.github/workflows/fusion.yml'

permissions:
  contents: write

jobs:
  stamp-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-time diagnostic refinement
        if: github.event_name == 'push' && github.event.head_commit.message == 'diag: safer diagnostic capture'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('Module.sgmodule')
          text = p.read_text('utf-8')

          # hd2.3g.qq.com 在日志里只确认“腾讯手机管家会访问”，尚未确认是广告接口。
          # 撤销整域 REJECT，改为临时 MITM 抓具体 HTTPS 路径，优先保证稳定性。
          text = text.replace('DOMAIN,hd2.3g.qq.com,REJECT,extended-matching,pre-matching\n', '')

          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('hostname = '):
                  hosts = [x.strip() for x in line.split('=', 1)[1].split(',') if x.strip()]
                  # 已确认只属于日志/心跳的临时抓包主机退出 MITM。
                  hosts = [h for h in hosts if h not in {'szmg.qq.com', 'content.rconfig.qq.com'}]
                  # 住这儿：广告列表已命中但广告仍显示，继续抓素材主机路径。
                  # 腾讯手机管家：GDT 链路已拦截，继续抓 A/B/3G 配置路径，不整域封禁。
                  for host in [
                      'api.5th.zone',
                      'media.5th.zone',
                      'i.4009515151.com',
                      'data.ab.qq.com',
                      'hd2.3g.qq.com',
                  ]:
                      if host not in hosts:
                          hosts.append(host)
                  seen = set()
                  deduped = []
                  for host in hosts:
                      if host not in seen:
                          seen.add(host)
                          deduped.append(host)
                  lines[i] = 'hostname = ' + ','.join(deduped)
                  break
          else:
              raise SystemExit('MITM hostname line not found')

          p.write_text('\n'.join(lines) + '\n', 'utf-8')
          PY

      - name: Stamp Beijing update time
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          ts = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M')

          module = Path('Module.sgmodule')
          lines = module.read_text('utf-8').splitlines()
          if len(lines) < 2:
              raise SystemExit('Module.sgmodule is too short')
          lines[0] = '#!name=广告屏蔽联网版'
          lines[1] = f'#!desc=仓库更新时间：{ts}'
          module.write_text('\n'.join(lines) + '\n', 'utf-8')

          readme = Path('README.md')
          text = readme.read_text('utf-8')
          text = re.sub(r'- \*\*最近更新时间：\*\* .*', f'- **最近更新时间：** {ts}', text)
          text = re.sub(r'仓库更新时间：\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2})?', f'仓库更新时间：{ts}', text)
          readme.write_text(text, 'utf-8')
          print(f'Stamped: {ts} Asia/Shanghai')
          PY

      - name: Validate module structure
        shell: bash
        run: |
          set -euo pipefail
          test -s Module.sgmodule
          test "$(head -n 1 Module.sgmodule)" = '#!name=广告屏蔽联网版'
          grep -Eq '^#!desc=仓库更新时间：[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$' Module.sgmodule
          grep -q '^\[Rule\]$' Module.sgmodule
          grep -q '^\[URL Rewrite\]$' Module.sgmodule
          grep -q '^\[Body Rewrite\]$' Module.sgmodule
          grep -q '^\[Map Local\]$' Module.sgmodule
          grep -q '^\[Script\]$' Module.sgmodule
          grep -q '^\[MITM\]$' Module.sgmodule
          test "$(grep -c '^hostname = ' Module.sgmodule)" -eq 1
          grep -q '^DOMAIN,rpt\.gdt\.qq\.com,REJECT' Module.sgmodule
          ! grep -q '^DOMAIN,hd2\.3g\.qq\.com,REJECT' Module.sgmodule
          grep '^hostname = ' Module.sgmodule | grep -q 'api.5th.zone'
          grep '^hostname = ' Module.sgmodule | grep -q 'media.5th.zone'
          grep '^hostname = ' Module.sgmodule | grep -q 'i.4009515151.com'
          grep '^hostname = ' Module.sgmodule | grep -q 'data.ab.qq.com'
          grep '^hostname = ' Module.sgmodule | grep -q 'hd2.3g.qq.com'
          ! grep '^hostname = ' Module.sgmodule | grep -q 'szmg.qq.com'
          ! grep '^hostname = ' Module.sgmodule | grep -q 'content.rconfig.qq.com'
          ! grep -q 'umetrip_ads\.js' Module.sgmodule
          ! grep -q '/JavaScript/jd\.js' Module.sgmodule
          echo "Module validation passed."

      - name: Commit module changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Module.sgmodule README.md
          if git diff --cached --quiet; then
            echo "No module or timestamp change needed."
            exit 0
          fi
          git commit -m "diag: capture remaining 住这儿 and Tencent ad paths"
          git push
