name: Validate Shadowrocket ad module

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Module.sgmodule'
      - '.github/workflows/fusion.yml'
      - 'scripts/**'
      - 'profiles/**'
      - 'tools/validate_personal_rules.py'
      - 'tools/test_adblock_scripts.js'

permissions:
  contents: read

concurrency:
  group: shadowrocket-module-validation
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check personal routing safety and ad module structure
        run: python3 tools/validate_personal_rules.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.js; do node --check "$script"; done
      - name: Check ad-response fixture regressions
        run: node tools/test_adblock_scripts.js
      - name: Show module metadata
        run: |
          head -n 2 Module.sgmodule
          echo "Rules: $(grep -Ec '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|AND),' Module.sgmodule || true)"
