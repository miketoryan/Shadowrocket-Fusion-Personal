name: Update Shadowrocket module metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fusion.yml'

permissions:
  contents: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update module name and repository date
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('Module.sgmodule')
          lines = p.read_text(encoding='utf-8').splitlines()
          if len(lines) < 2:
              raise SystemExit('Module.sgmodule is too short')
          lines[0] = '#!name=广告屏蔽联网版'
          lines[1] = '#!desc=仓库更新时间：2026-09-17'
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          test "$(head -n 1 Module.sgmodule)" = '#!name=广告屏蔽联网版'
          test "$(sed -n '2p' Module.sgmodule)" = '#!desc=仓库更新时间：2026-09-17'

      - name: Commit metadata update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Module.sgmodule
          if git diff --cached --quiet; then
            echo "Metadata already current."
            exit 0
          fi
          git commit -m "update: module display name and repository date"
          git push
