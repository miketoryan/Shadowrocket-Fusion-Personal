name: Refine Shadowrocket ad rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Module.sgmodule'
      - '.github/workflows/fusion.yml'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  refine-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply approved high-confidence rules and keep diagnostics clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import re

          module = Path('Module.sgmodule')
          lines = module.read_text('utf-8').splitlines()

          # 第一梯队：多上游交叉确认、广告属性明确，仅做精确 DOMAIN 拦截。
          # 不扩大为 qq.com / weibo.com / netease.com 等宽泛后缀，避免误伤正常业务。
          tencent_core_rules = [
              'DOMAIN,adsmind.gdtimg.com,REJECT,extended-matching,pre-matching',
              'DOMAIN,adsmind.apdcdn.tc.qq.com,REJECT,extended-matching,pre-matching',
              'DOMAIN,adsmind.tc.qq.com,REJECT,extended-matching,pre-matching',
              'DOMAIN,pgdt.gtimg.com,REJECT,extended-matching,pre-matching',
              'DOMAIN,adslvfile.qq.com,REJECT,extended-matching,pre-matching',
              'DOMAIN,adslvseed.qq.com,REJECT,extended-matching,pre-matching',
          ]
          netease_core_rule = 'DOMAIN,ad.bn.netease.com,REJECT,extended-matching,pre-matching'
          weibo_core_rule = 'DOMAIN,adimg.uve.weibo.com,REJECT,extended-matching,pre-matching'

          # 豆瓣 7.133.0 日志实证：豆瓣自有 splash API 已被拦截，
          # 但腾讯广告素材/竞价链路仍从以下 3 个主机直连成功。
          douban_rules = [
              'DOMAIN,pgdt.ugdtimg.com,REJECT,extended-matching,pre-matching',
              'DOMAIN,adsmind.ugdtimg.com,REJECT,extended-matching,pre-matching',
              'DOMAIN,v2mi.gdt.qq.com,REJECT,extended-matching,pre-matching',
          ]

          tencent_comment = '# 高置信度补强：AWAvenue / Cats-Team / 217heidai 多源交叉确认的腾讯广告素材链路'
          douban_comment = '# 豆瓣开屏：2026-09-17 日志实证漏网的 GDT 素材 / QUIC 主机'
          netease_comment = '# 高置信度补强：fmz200 / AWAvenue / 217heidai 均收录的网易广告主机'
          weibo_comment = '# 高置信度补强：AWAvenue / 217heidai 均收录的微博广告素材主机'

          # 全局去重规则和由本工作流维护的注释，再按功能区重新插入，保证重复执行不会堆积。
          approved_exact_rules = set(tencent_core_rules + douban_rules + [netease_core_rule, weibo_core_rule])
          managed_comments = {tencent_comment, douban_comment, netease_comment, weibo_comment}
          lines = [
              line for line in lines
              if line not in approved_exact_rules and line not in managed_comments
          ]

          # 腾讯 / GDT：放在现有腾讯广点通规则附近。
          anchor = 'DOMAIN,p.l.qq.com,REJECT,extended-matching,pre-matching'
          try:
              idx = lines.index(anchor) + 1
          except ValueError:
              raise SystemExit('Tencent GDT rule anchor not found')
          insert = [
              tencent_comment,
              *tencent_core_rules,
              douban_comment,
              *douban_rules,
          ]
          lines[idx:idx] = insert

          # 网易：只补一个明确广告主机，不碰统计、HTTPDNS 或账号链路。
          netease_anchor = 'DOMAIN,iad.g.163.com,REJECT,extended-matching,pre-matching'
          try:
              idx = lines.index(netease_anchor) + 1
          except ValueError:
              raise SystemExit('NetEase rule anchor not found')
          lines[idx:idx] = [netease_comment, netease_core_rule]

          # 微博：补充广告图片素材主机，保持现有 SDK 拦截逻辑不变。
          weibo_anchor = 'DOMAIN,sdkclick.biz.weibo.com,REJECT,extended-matching,pre-matching'
          try:
              idx = lines.index(weibo_anchor) + 1
          except ValueError:
              raise SystemExit('Weibo rule anchor not found')
          lines[idx:idx] = [weibo_comment, weibo_core_rule]

          # 腾讯手机管家已通过 App 内广告开关解决，撤销所有临时诊断 MITM。
          remove_mitm = {
              'content.rconfig.qq.com',
              'ta-cn-south-00001-1329476759.cos.accelerate.tencentcos.cn',
              'luban.m.qq.com',
              'tmfmazu.m.qq.com',
              'tmfmazu4.m.qq.com',
              'hd2.3g.qq.com',
              'data.ab.qq.com',
          }
          for i, line in enumerate(lines):
              if line.startswith('hostname = '):
                  hosts = [x.strip() for x in line.split('=', 1)[1].split(',') if x.strip()]
                  hosts = [h for h in hosts if h not in remove_mitm]
                  if 'api.5th.zone' not in hosts:
                      hosts.append('api.5th.zone')
                  seen = set()
                  deduped = []
                  for host in hosts:
                      if host not in seen:
                          seen.add(host)
                          deduped.append(host)
                  lines[i] = 'hostname = ' + ','.join(deduped)
                  break
          else:
              raise SystemExit('MITM hostname line not found')

          # 更新时间戳。
          ts = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M')
          lines[0] = '#!name=广告屏蔽联网版'
          lines[1] = f'#!desc=仓库更新时间：{ts}'
          module.write_text('\n'.join(lines) + '\n', 'utf-8')

          readme = Path('README.md')
          if readme.exists():
              text = readme.read_text('utf-8')
              text = re.sub(r'- \*\*最近更新时间：\*\* .*', f'- **最近更新时间：** {ts}', text)
              text = re.sub(r'仓库更新时间：\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2})?', f'仓库更新时间：{ts}', text)
              readme.write_text(text, 'utf-8')
          print(f'Module refined and stamped: {ts} Asia/Shanghai')
          PY

      - name: Validate refined module
        shell: bash
        run: |
          set -euo pipefail
          test -s Module.sgmodule
          test "$(head -n 1 Module.sgmodule)" = '#!name=广告屏蔽联网版'
          grep -Eq '^#!desc=仓库更新时间：[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$' Module.sgmodule
          grep -q '^\[Rule\]$' Module.sgmodule
          grep -q '^\[URL Rewrite\]$' Module.sgmodule
          grep -q '^\[Script\]$' Module.sgmodule
          grep -q '^\[MITM\]$' Module.sgmodule
          test "$(grep -c '^hostname = ' Module.sgmodule)" -eq 1

          # 住这儿正式修复继续保留。
          grep -q '^DOMAIN,api\.5th\.zone,DIRECT$' Module.sgmodule
          grep -Fq 'zhuzher_ads_empty.js' Module.sgmodule
          grep '^hostname = ' Module.sgmodule | grep -q 'api.5th.zone'

          # 第一梯队高置信度广告域：必须全部存在且保持精确 DOMAIN。
          grep -q '^DOMAIN,adsmind\.gdtimg\.com,REJECT,extended-matching,pre-matching$' Module.sgmodule
          grep -q '^DOMAIN,adsmind\.apdcdn\.tc\.qq\.com,REJECT,extended-matching,pre-matching$' Module.sgmodule
          grep -q '^DOMAIN,adsmind\.tc\.qq\.com,REJECT,extended-matching,pre-matching$' Module.sgmodule
          grep -q '^DOMAIN,pgdt\.gtimg\.com,REJECT,extended-matching,pre-matching$' Module.sgmodule
          grep -q '^DOMAIN,adslvfile\.qq\.com,REJECT,extended-matching,pre-matching$' Module.sgmodule
          grep -q '^DOMAIN,adslvseed\.qq\.com,REJECT,extended-matching,pre-matching$' Module.sgmodule
          grep -q '^DOMAIN,ad\.bn\.netease\.com,REJECT,extended-matching,pre-matching$' Module.sgmodule
          grep -q '^DOMAIN,adimg\.uve\.weibo\.com,REJECT,extended-matching,pre-matching$' Module.sgmodule

          # 豆瓣日志实证补漏继续保留。
          grep -q '^DOMAIN,pgdt\.ugdtimg\.com,REJECT,extended-matching,pre-matching$' Module.sgmodule
          grep -q '^DOMAIN,adsmind\.ugdtimg\.com,REJECT,extended-matching,pre-matching$' Module.sgmodule
          grep -q '^DOMAIN,v2mi\.gdt\.qq\.com,REJECT,extended-matching,pre-matching$' Module.sgmodule
          grep -Fq '^https?:\/\/api\.douban\.com\/v\d+\/app_ads\/.* - reject' Module.sgmodule

          # 本工作流维护的说明注释也必须保持单份，防止重复堆积。
          test "$(grep -Fc '# 高置信度补强：AWAvenue / Cats-Team / 217heidai 多源交叉确认的腾讯广告素材链路' Module.sgmodule)" -eq 1
          test "$(grep -Fc '# 豆瓣开屏：2026-09-17 日志实证漏网的 GDT 素材 / QUIC 主机' Module.sgmodule)" -eq 1
          test "$(grep -Fc '# 高置信度补强：fmz200 / AWAvenue / 217heidai 均收录的网易广告主机' Module.sgmodule)" -eq 1
          test "$(grep -Fc '# 高置信度补强：AWAvenue / 217heidai 均收录的微博广告素材主机' Module.sgmodule)" -eq 1

          # 临时腾讯诊断必须保持清理状态。
          ! grep '^hostname = ' Module.sgmodule | grep -q 'hd2.3g.qq.com'
          ! grep '^hostname = ' Module.sgmodule | grep -q 'data.ab.qq.com'
          ! grep '^hostname = ' Module.sgmodule | grep -q 'tmfmazu.m.qq.com'
          ! grep '^hostname = ' Module.sgmodule | grep -q 'tmfmazu4.m.qq.com'
          ! grep '^hostname = ' Module.sgmodule | grep -q 'luban.m.qq.com'
          ! grep '^hostname = ' Module.sgmodule | grep -q 'content.rconfig.qq.com'

          # 已知失效脚本不能回归。
          ! grep -q 'app2smile/rules/master/js/bilibili\.js' Module.sgmodule
          ! grep -q 'umetrip_ads\.js' Module.sgmodule
          ! grep -q '/JavaScript/jd\.js' Module.sgmodule
          echo "Refined module validation passed."

      - name: Commit refined module
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Module.sgmodule README.md
          if git diff --cached --quiet; then
            echo "No refined module change needed."
            exit 0
          fi
          git commit -m "feat: add high-confidence ad endpoints"
          git push
