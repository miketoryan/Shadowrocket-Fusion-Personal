name: Safe daily ad-domain sync

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

concurrency:
  group: shadowrocket-safe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Update exact domains from approved source
        run: python3 tools/safe_ad_sync.py
      - name: Validate module and scripts before publication
        run: |
          set -euo pipefail
          python3 tools/validate_personal_rules.py
          for s in scripts/*.js; do node --check "$s"; done
          node tools/test_adblock_scripts.js
          test "$(grep -c '^hostname = ' Module.sgmodule)" -eq 1
          ! grep -Eq '^\s*ca-(p12|passphrase)\s*=\s*\S' Module.sgmodule
      - name: Commit only when approved ad domains change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Module.sgmodule README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No safe rule change to publish"
            exit 0
          fi
          git commit -m "chore(adblock): safely sync vetted exact ad domains"
          git push
